    <div class="title">
        <h1>Syntax Tree Creator and Viewer</h1>
    </div>

    <div class="main-container">
        <div class="tree-editor-container">
            <label for="tree-editor">Enter syntax tree text here:</label>

            <textarea id="tree-editor" rows="15" cols="30">
[expr
     [term
         [factor
             [id [B]]
         ]
     ]
     [+]
     [term
         [factor
             [id [C]]
         ]
     ]
]</textarea>
        </div>
        <div class="tree-viewer-container">
            
        </div>
    </div>

    <footer>Made with 💜 and 30 minutes :3</footer>
